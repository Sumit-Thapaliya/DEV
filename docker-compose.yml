services:
  postgres:
    image: postgres:16-alpine
    container_name: jobdev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobdev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobdev}
      POSTGRES_DB: ${POSTGRES_DB:-jobdev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobdev} -d ${POSTGRES_DB:-jobdev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobdev-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: jobdev-backend
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobdev}:${POSTGRES_PASSWORD:-jobdev}@postgres:5432/${POSTGRES_DB:-jobdev}?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

